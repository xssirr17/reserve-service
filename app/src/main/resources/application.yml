spring:
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reserve}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    # Sizing rule: total database connections across all running instances
    # (instances * maximum-pool-size) must remain safely below PostgreSQL max_connections (default 100),
    # reserving at least 15-20 connections for migrations, admin sessions, and background workers.
    # E.g., 5 instances * 15 connections = 75 connections < 100 max_connections.
    hikari:
      pool-name: reserve-pool
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:15}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:30000}
      # Set PostgreSQL sanity timeouts: lock_timeout aborts blocked row lock waits (5s);
      # statement_timeout prevents runaway queries or hung batch jobs (10s).
      connection-init-sql: ${DB_POOL_INIT_SQL:SET lock_timeout = '5000ms'; SET statement_timeout = '10000ms';}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: "reserve-sched-"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: never

server:
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:50}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:50}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:1000}
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    org.springframework.web: INFO